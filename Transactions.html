<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HOCHAT CAFE - Serving the best and budget-friendly in town. Premium food, great ambiance, and excellent service all in one place. Visit us at Gerona, Tarlac City.">
    <meta name="keywords" content="hochat cafe, HOCHAT CAFE, Gerona Restaurant, Cafe Gerona, Hochat, hochat">
    <meta name="author" content="HOCHAT CAFE">
    <title>Hochat Café - Order History</title>
    <link rel="icon" href="HOTCHAT CAFE/HOCHAT-CAFE LOGO-ICON.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS FILES/site.css">
    <link rel="stylesheet" href="CSS FILES/Transactions.css">
    <script src="JS FILES/menu-data.js"></script>
    <script src="JS FILES/site.js"></script>
</head>
<body>
    <script>renderHeader('history');</script>

    <main id="main">
        <section class="page-hero">
            <div class="container history-container">
                <h1 class="page-title">Order History</h1>
            </div>
        </section>
        <div class="container history-container" id="historyRoot"></div>
    </main>

    <script>renderFooter();</script>
    <script>
        // ========== ORDER HISTORY PAGE ==========
        const root = document.getElementById('historyRoot');

        // HOCHAT-1762400000000-412 is shown as #000000-412
        function shortOrderId(id) {
            const parts = String(id).split('-');
            return parts.length === 3 ? `#${parts[1].slice(-6)}-${parts[2]}` : `#${id}`;
        }

        function formatDate(date) {
            return new Date(date).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit'
            });
        }

        function statusLabel(status) {
            const text = String(status || 'completed');
            return text.charAt(0).toUpperCase() + text.slice(1);
        }

        function renderHistory() {
            if (!isLoggedIn()) {
                root.innerHTML = `
                    <div class="state-card">
                        <span class="state-icon">${icon('lock')}</span>
                        <h2 class="state-title">Log in to see your orders</h2>
                        <p class="state-text">Your past orders are saved to your account.</p>
                        <div class="state-actions">
                            <a class="btn btn-primary" href="${getLoginUrl()}">Log In</a>
                            <a class="btn btn-outline" href="MenuPage.html">Browse the Menu</a>
                        </div>
                    </div>
                `;
                return;
            }

            const orders = [...getUserOrders()].sort((a, b) => new Date(b.date) - new Date(a.date));

            if (orders.length === 0) {
                root.innerHTML = `
                    <div class="state-card">
                        <span class="state-icon">${icon('receipt')}</span>
                        <h2 class="state-title">No orders yet</h2>
                        <p class="state-text">Start ordering to see your history here!</p>
                        <a class="btn btn-primary" href="MenuPage.html">Browse the Menu</a>
                    </div>
                `;
                return;
            }

            root.innerHTML = `
                <div class="order-list">
                    ${orders.map((order) => `
                        <article class="order-card">
                            <header class="order-head">
                                <div>
                                    <h2 class="order-id">Order ${escapeHtml(shortOrderId(order.id))}</h2>
                                    <p class="order-date">${formatDate(order.date)}</p>
                                </div>
                                <span class="order-status">${escapeHtml(statusLabel(order.status))}</span>
                            </header>
                            <ul class="order-items">
                                ${order.items.map((item) => `
                                    <li class="order-row">
                                        <span><strong>${item.quantity}×</strong> ${escapeHtml(item.name)}</span>
                                        <span>${formatPeso(item.total)}</span>
                                    </li>
                                `).join('')}
                            </ul>
                            <div class="order-totals">
                                <div class="order-row"><span>Subtotal</span><span>${formatPeso(order.subtotal)}</span></div>
                                <div class="order-row"><span>Delivery Fee</span><span>${formatPeso(order.deliveryFee)}</span></div>
                                <div class="order-row order-total"><span>Total</span><span>${formatPeso(order.total)}</span></div>
                            </div>
                        </article>
                    `).join('')}
                </div>
            `;
        }

        renderHistory();
    </script>
</body>
</html>
