<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HOCHAT CAFE - Serving the best and budget-friendly in town. Premium food, great ambiance, and excellent service all in one place. Visit us at Gerona, Tarlac City.">
    <meta name="keywords" content="hochat cafe, HOCHAT CAFE, Gerona Restaurant, Cafe Gerona, Hochat, hochat">
    <meta name="author" content="HOCHAT CAFE">
    <title>Hochat Café - My Cart</title>
    <link rel="icon" href="HOTCHAT CAFE/HOCHAT-CAFE LOGO-ICON.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS FILES/site.css">
    <link rel="stylesheet" href="CSS FILES/Cart.css">
    <script src="JS FILES/menu-data.js"></script>
    <script src="JS FILES/site.js"></script>
</head>
<body>
    <script>renderHeader('cart');</script>

    <main id="main">
        <section class="page-hero">
            <div class="container">
                <h1 class="page-title">My Cart</h1>
            </div>
        </section>
        <div class="container" id="cartRoot"></div>
    </main>

    <script>renderFooter();</script>
    <script>
        // ========== CART PAGE ==========
        const root = document.getElementById('cartRoot');
        let cartItems = getUserCart();

        function renderGuest() {
            root.innerHTML = `
                <div class="state-card">
                    <span class="state-icon">${icon('lock')}</span>
                    <h2 class="state-title">Log in to start your order</h2>
                    <p class="state-text">Browsing is free for everyone. To add food to your cart and check out, please log in or create an account.</p>
                    <div class="state-actions">
                        <a class="btn btn-primary" href="${getLoginUrl()}">Log In</a>
                        <a class="btn btn-outline" href="MenuPage.html">Browse the Menu</a>
                    </div>
                </div>
            `;
        }

        function renderEmpty() {
            root.innerHTML = `
                <div class="state-card">
                    <span class="state-icon">${icon('cart')}</span>
                    <h2 class="state-title">Your cart is empty</h2>
                    <p class="state-text">Add some delicious items from our menu!</p>
                    <a class="btn btn-primary" href="MenuPage.html">Browse the Menu</a>
                </div>
            `;
        }

        function renderCart() {
            if (!isLoggedIn()) {
                renderGuest();
                return;
            }
            if (cartItems.length === 0) {
                renderEmpty();
                return;
            }

            const subtotal = cartItems.reduce((sum, item) => sum + item.price * item.quantity, 0);

            root.innerHTML = `
                <div class="cart-layout">
                    <ul class="cart-list">
                        ${cartItems.map((item, index) => `
                            <li class="cart-item">
                                <img class="cart-photo" src="${escapeHtml(item.image)}" alt="${escapeHtml(item.name)}">
                                <div class="cart-details">
                                    <h2 class="cart-name">${escapeHtml(item.name)}</h2>
                                    <p class="cart-each">${formatPeso(item.price)} each</p>
                                </div>
                                <div class="stepper stepper-small" role="group" aria-label="Quantity of ${escapeHtml(item.name)}">
                                    <button class="stepper-btn" type="button" data-action="decrease" data-index="${index}" aria-label="Decrease quantity">${icon('minus')}</button>
                                    <span class="stepper-value">${item.quantity}</span>
                                    <button class="stepper-btn" type="button" data-action="increase" data-index="${index}" aria-label="Increase quantity">${icon('plus')}</button>
                                </div>
                                <p class="cart-line-total">${formatPeso(item.price * item.quantity)}</p>
                                <button class="icon-btn cart-remove" type="button" data-action="remove" data-index="${index}" aria-label="Remove ${escapeHtml(item.name)}">${icon('trash')}</button>
                            </li>
                        `).join('')}
                    </ul>

                    <aside class="summary-card" aria-label="Order summary">
                        <h2 class="summary-title">Order Summary</h2>
                        <div class="summary-row"><span>Subtotal</span><span>${formatPeso(subtotal)}</span></div>
                        <div class="summary-row"><span>Delivery Fee</span><span>${formatPeso(DELIVERY_FEE)}</span></div>
                        <div class="summary-row summary-total"><span>Total</span><span>${formatPeso(subtotal + DELIVERY_FEE)}</span></div>
                        <button class="btn btn-primary btn-block" type="button" id="checkoutBtn">Proceed to Checkout</button>
                        <a class="btn btn-outline btn-block" href="MenuPage.html">Continue Shopping</a>
                    </aside>
                </div>
            `;

            document.getElementById('checkoutBtn').addEventListener('click', checkout);
        }

        function saveAndRender() {
            saveUserCart(cartItems);
            renderCart();
        }

        async function removeItem(index) {
            const confirmed = await showDialog({
                title: 'Remove item?',
                message: `Remove ${cartItems[index].name} from your cart?`,
                confirmText: 'Remove',
                cancelText: 'Keep It',
                danger: true
            });
            if (confirmed) {
                cartItems.splice(index, 1);
                saveAndRender();
            }
        }

        root.addEventListener('click', (event) => {
            const button = event.target.closest('[data-action]');
            if (!button) return;

            const index = Number(button.dataset.index);
            const action = button.dataset.action;

            if (action === 'remove') {
                removeItem(index);
                return;
            }

            if (action === 'decrease' && cartItems[index].quantity === 1) {
                removeItem(index);
                return;
            }

            cartItems[index].quantity += action === 'increase' ? 1 : -1;
            saveAndRender();
        });

        async function checkout() {
            // Double-check in case the customer logged out in another tab
            if (!isLoggedIn()) {
                promptLogin();
                return;
            }

            const subtotal = cartItems.reduce((sum, item) => sum + item.price * item.quantity, 0);
            const total = subtotal + DELIVERY_FEE;

            const confirmed = await showDialog({
                title: 'Place your order?',
                message: `Your total is ${formatPeso(total)}, including the ${formatPeso(DELIVERY_FEE)} delivery fee.`,
                confirmText: 'Place Order',
                cancelText: 'Not Yet'
            });
            if (!confirmed) return;

            const order = {
                id: generateOrderId(),
                items: cartItems.map((item) => ({
                    name: item.name,
                    quantity: item.quantity,
                    price: item.price,
                    total: item.price * item.quantity
                })),
                subtotal: subtotal,
                deliveryFee: DELIVERY_FEE,
                total: total,
                date: new Date().toISOString(),
                status: 'completed'
            };

            saveUserOrder(order);
            cartItems = [];
            saveUserCart(cartItems);

            root.innerHTML = `
                <div class="state-card">
                    <span class="state-icon">${icon('check')}</span>
                    <h2 class="state-title">Order placed!</h2>
                    <p class="state-text">Thank you for your order, ${escapeHtml(getCurrentUser().firstName)}. Your total is ${formatPeso(total)}.</p>
                    <div class="state-actions">
                        <a class="btn btn-primary" href="Transactions.html">View Order History</a>
                        <a class="btn btn-outline" href="MenuPage.html">Back to Menu</a>
                    </div>
                </div>
            `;
        }

        renderCart();
    </script>
</body>
</html>
