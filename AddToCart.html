<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HOCHAT CAFE - Serving the best and budget-friendly in town. Premium food, great ambiance, and excellent service all in one place. Visit us at Gerona, Tarlac City.">
    <meta name="keywords" content="hochat cafe, HOCHAT CAFE, Gerona Restaurant, Cafe Gerona, Hochat, hochat">
    <meta name="author" content="HOCHAT CAFE">
    <title>Hochat Café - Item</title>
    <link rel="icon" href="HOTCHAT CAFE/HOCHAT-CAFE LOGO-ICON.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS FILES/site.css">
    <link rel="stylesheet" href="CSS FILES/AddToCart.css">
    <script src="JS FILES/menu-data.js"></script>
    <script src="JS FILES/site.js"></script>
</head>
<body>
    <script>renderHeader('menu');</script>

    <main id="main">
        <div class="container" id="itemRoot"></div>
    </main>

    <script>renderFooter();</script>
    <script>
        // ========== ITEM PAGE ==========
        // The item comes from the link, for example AddToCart.html?item=katsu-curry
        const root = document.getElementById('itemRoot');
        const itemId = new URLSearchParams(location.search).get('item');
        const match = findMenuItem(itemId);

        if (!match) {
            root.innerHTML = `
                <div class="state-card item-missing">
                    <span class="state-icon">${icon('cart')}</span>
                    <h1 class="state-title">We couldn't find that item</h1>
                    <p class="state-text">It may have moved. Have a look through our menu instead.</p>
                    <a class="btn btn-primary" href="MenuPage.html">Browse the Menu</a>
                </div>
            `;
        } else {
            renderItem(match.item, match.category);
        }

        function renderItem(item, category) {
            const loggedIn = isLoggedIn();
            let quantity = 1;

            document.title = `Hochat Café - ${item.name}`;

            root.innerHTML = `
                <a class="back-link item-back" href="${category.page}">${icon('arrowLeft')}Back to ${escapeHtml(category.title)}</a>
                <div class="item-layout">
                    <div class="item-photo">
                        <img src="${item.image}" alt="${escapeHtml(item.name)}">
                    </div>
                    <div class="item-info">
                        <span class="eyebrow">${escapeHtml(category.title)}</span>
                        <h1 class="item-name">${escapeHtml(item.name)}</h1>
                        <p class="item-price">${formatPeso(item.price)}</p>
                        ${item.description ? `<p class="item-desc">${escapeHtml(item.description)}</p>` : ''}

                        <div class="item-order">
                            <div class="item-order-row">
                                <span class="item-label" id="quantityLabel">Quantity</span>
                                <div class="stepper" role="group" aria-labelledby="quantityLabel">
                                    <button class="stepper-btn" type="button" id="decreaseBtn" aria-label="Decrease quantity">${icon('minus')}</button>
                                    <span class="stepper-value" id="quantityDisplay" aria-live="polite">1</span>
                                    <button class="stepper-btn" type="button" id="increaseBtn" aria-label="Increase quantity">${icon('plus')}</button>
                                </div>
                            </div>
                            <div class="item-order-row">
                                <span class="item-label">Total</span>
                                <span class="item-total" id="totalPrice">${formatPeso(item.price)}</span>
                            </div>
                            <button class="btn btn-primary btn-block" type="button" id="addToCartBtn">
                                ${loggedIn ? `${icon('cart')}Add to Cart` : `${icon('lock')}Log In to Order`}
                            </button>
                            ${loggedIn ? '' : '<p class="item-note">You can browse freely. An account is only needed to order.</p>'}
                        </div>
                    </div>
                </div>
            `;

            const quantityDisplay = document.getElementById('quantityDisplay');
            const totalPrice = document.getElementById('totalPrice');

            function updateTotal() {
                quantityDisplay.textContent = quantity;
                totalPrice.textContent = formatPeso(item.price * quantity);
            }

            document.getElementById('increaseBtn').addEventListener('click', () => {
                if (quantity < 99) quantity++;
                updateTotal();
            });

            document.getElementById('decreaseBtn').addEventListener('click', () => {
                if (quantity > 1) quantity--;
                updateTotal();
            });

            document.getElementById('addToCartBtn').addEventListener('click', () => {
                // Guests can look at the item, but ordering needs an account
                if (!isLoggedIn()) {
                    promptLogin();
                    return;
                }

                const cart = getUserCart();
                const existing = cart.find((entry) => entry.name === item.name && entry.category === category.code);

                if (existing) {
                    existing.quantity += quantity;
                    existing.total = existing.price * existing.quantity;
                } else {
                    cart.push({
                        id: generateOrderId(),
                        name: item.name,
                        category: category.code,
                        quantity: quantity,
                        price: item.price,
                        total: item.price * quantity,
                        image: item.image,
                        addedAt: new Date().toISOString()
                    });
                }

                saveUserCart(cart);
                showToast(`${quantity} × ${item.name} added to cart`, { label: 'View Cart', href: 'Cart.html' });
                quantity = 1;
                updateTotal();
            });
        }
    </script>
</body>
</html>
