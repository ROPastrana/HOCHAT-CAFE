<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HOCHAT CAFE - Serving the best and budget-friendly in town. Premium food, great ambiance, and excellent service all in one place. Visit us at Gerona, Tarlac City.">
    <meta name="keywords" content="hochat cafe, HOCHAT CAFE, Gerona Restaurant, Cafe Gerona, Hochat, hochat">
    <meta name="author" content="HOCHAT CAFE">
    <title>Hochat Café - Sign Up</title>
    <link rel="icon" href="HOTCHAT CAFE/HOCHAT-CAFE LOGO-ICON.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS FILES/site.css">
    <link rel="stylesheet" href="CSS FILES/LoginPage.css">
    <script src="JS FILES/menu-data.js"></script>
    <script src="JS FILES/site.js"></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-photo">
            <p class="auth-quote">Every dish, every drink, every story shared.</p>
        </div>
        <main class="auth-panel" id="main">
            <div class="auth-box auth-box-wide">
                <a class="back-link" href="index.html" id="backLink">Back to the site</a>
                <img class="auth-logo" src="HOTCHAT CAFE/WEB IMAGES/logo.webp" alt="Hochat Café" width="88" height="87">
                <h1 class="auth-title">Create your account</h1>
                <p class="auth-subtitle">It only takes a minute, and then you can start ordering.</p>

                <p class="auth-error" id="authError" role="alert" hidden></p>

                <form class="auth-form" id="signupForm" novalidate>
                    <div class="field-row">
                        <div class="field">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" autocomplete="given-name" required>
                        </div>
                        <div class="field">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" autocomplete="family-name" required>
                        </div>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label for="email">Email</label>
                            <input type="email" id="email" autocomplete="email" required>
                        </div>
                        <div class="field">
                            <label for="contactNumber">Contact Number</label>
                            <input type="tel" id="contactNumber" autocomplete="tel" required>
                        </div>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label for="password">Password</label>
                            <input type="password" id="password" autocomplete="new-password" minlength="8" required>
                        </div>
                        <div class="field">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" autocomplete="new-password" required>
                        </div>
                    </div>
                    <button class="btn btn-primary btn-block" type="submit">Create Your Account</button>
                </form>

                <p class="auth-switch">Already have an account? <a id="loginLink" href="LoginPage.html">Log in</a></p>
            </div>
        </main>
    </div>

    <script>
        // ========== SIGN UP PAGE ==========
        const errorBox = document.getElementById('authError');
        const loginPage = `LoginPage.html?next=${encodeURIComponent(getNextPage())}`;

        document.getElementById('backLink').insertAdjacentHTML('afterbegin', icon('arrowLeft'));
        document.getElementById('loginLink').href = loginPage;

        function showError(message) {
            errorBox.textContent = message;
            errorBox.hidden = false;
            errorBox.scrollIntoView({ block: 'center' });
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        document.getElementById('signupForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const contactNumber = document.getElementById('contactNumber').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!firstName || !lastName || !email || !contactNumber || !password || !confirmPassword) {
                showError('Please fill in all fields.');
                return;
            }

            if (!validateEmail(email)) {
                showError('Please enter a valid email address.');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match.');
                return;
            }

            if (password.length < 8) {
                showError('Password must be at least 8 characters.');
                return;
            }

            const submitButton = event.target.querySelector('button[type="submit"]');
            submitButton.disabled = true;

            try {
                const result = await apiRequest('signup', { firstName, lastName, email, contactNumber, password });

                if (!result.ok) {
                    showError(result.error);
                    return;
                }

                setFlashMessage('Account created! Please log in.');
                location.href = loginPage;
            } catch (error) {
                showError(SERVER_ERROR);
            } finally {
                submitButton.disabled = false;
            }

        });
    </script>
</body>
</html>
